<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- viewport-fit=cover：画面の切り欠き（ノッチ）のあるスマホでも端まで使う（余白は style.css の safe-area-inset） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050308" />
    <!-- ホーム画面に追加したときは、アドレスバーなしの全画面で開く -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>センタクアツ ― あなたの選択が、未来の敵をつくる</title>
    <meta name="description" content="抗菌薬の使い方しだいで未来に効く薬がなくなることを体感する教育用タワーディフェンス（教育用のシミュレーションで、実際の診療の判断には使えません。Claude は学生と会話しません）" />
    <!-- OGP：URL を Discord や X に貼ったときの題名・説明・画像（画像は public/og-image.jpg。1200×630） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="センタクアツ" />
    <meta property="og:title" content="センタクアツ ― あなたの選択が、未来の敵をつくる" />
    <meta property="og:description" content="抗菌薬の使い方しだいで未来に効く薬がなくなることを体感する教育用タワーディフェンス。切り札ばかり使うと、2050年に自分が残した耐性菌と戦うことになる。ブラウザだけで遊べます" />
    <meta property="og:url" content="https://ph1125ks.github.io/Built-with-Claude-Japan-2026/" />
    <meta property="og:image" content="https://ph1125ks.github.io/Built-with-Claude-Japan-2026/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- スマホの縦向きで遊んでいる間に出す（main.ts が body.rotate を付け、app.ts が止める。style.css） -->
    <div id="rotate-hint"><i class="phone"></i><b>横向きにしてください</b><span>盤面は横長（16:9）で作っています。<br>横向きにすると、そのまま続けられます。</span></div>
    <div id="app">
      <!-- 盤面と手札：1280×720 のまま、画面に合わせて縮める -->
      <div id="stage">
        <div id="board"></div>
        <div id="play"></div>
      </div>
      <!-- 文字の画面（タイトル・遊び方・結果）：広い画面では盤面と同じ縮め方、狭い画面では縮めずに1列に組み直す -->
      <div id="screen"></div>
      <!-- 「くわしい数字」のポップアップの置き場（#screen の外。#screen はスクロールするので、中に置くと一緒に流れてしまう。app.ts の showScreen が移す） -->
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
